name: Renovate Paperclip index

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: renovate-paperclip-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refresh stable Paperclip releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I ci/renovate/paperclip-index.py
